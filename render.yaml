# Optional: one-click backend hosting on Render.com ("Blueprint").
# The Streamlit frontend then points to this backend through API_URL.
services:
  - type: web
    name: healthbridge-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: XAI_API_KEY
        sync: false          # you paste this in the Render dashboard
      - key: XAI_MODEL
        value: grok-4.7
      - key: AUTO_SEED
        value: "true"
